":false},{"name":"Протеиновый порошок","grams":15,"checkLabel":false}],"steps":["Разогрейте духовку до 177°C.","Смешайте овсянку, протеин, корицу и разрыхлитель; вмешайте размятые бананы, растопленное масло, белки, молоко и сироп.","Переложите в смазанную форму 23×33 см и выпекайте 35–40 минут.","Смешайте сахарную пудру, ваниль, соль и молоко, нанесите глазурь на горячую овсянку и разделите на 6 порций."],"adaptation":"Добавлено 15 г протеина на порцию."},{"id":"goodfood-chicken-pasta-bake","kind":"existing","title":"Запеканка из пасты с курицей","slot":"dinner","time":75,"macros":{"kcal":579.7,"protein":39.6,"fat":25.3,"carbs":47.4},"image":"/recipe-images/goodfood-chicken-pasta-bake.webp","sourceTitle":"Chicken pasta bake","sourceUrl":"https://www.bbcgoodfood.com/recipes/chicken-pasta-bake","ingredients":[{"name":"Оливковое масло","grams":9,"checkLabel":false},{"name":"Репчатый лук","grams":18,"checkLabel":false},{"name":"Чеснок","grams":2,"checkLabel":false},{"name":"Протёртые томаты","grams":67,"checkLabel":false},{"name":"Белый сахар","grams":1,"checkLabel":false},{"name":"Маскарпоне","grams":15,"checkLabel":false},{"name":"Куриная грудка","grams":116,"checkLabel":false},{"name":"Макароны сухие","grams":50,"checkLabel":false},{"name":"Полутвёрдый сыр (обычный)","grams":12,"checkLabel":false},{"name":"Моцарелла","grams":8,"checkLabel":false}],"steps":["Обжарьте лук на среднем огне 10–12 минут, добавьте чеснок и хлопья чили на 1 минуту.","Введите томаты и сахар, томите без крышки 20 минут до густоты, затем вмешайте маскарпоне.","Отдельно обжарьте курицу 5–7 минут до полной готовности.","При 220°C, или 200°C с конвекцией, соедините сваренные пенне, курицу и соус в форме, посыпьте сырами и петрушкой, запекайте 20 минут до пузырьков и румяной корочки."],"adaptation":"Проверить перевод, хранение и КБЖУ."},{"id":"goodfood-tuna-pasta-bake","kind":"existing","title":"Запеканка из пасты с тунцом","slot":"lunch","time":50,"macros":{"kcal":494.4,"protein":25.7,"fat":24.9,"carbs":43.6},"image":"/recipe-images/goodfood-tuna-pasta-bake.webp","sourceTitle":"Tuna pasta bake","sourceUrl":"https://www.bbcgoodfood.com/recipes/tuna-pasta-bake","ingredients":[{"name":"Макароны сухие","grams":24,"checkLabel":false},{"name":"Сливочное масло","grams":9,"checkLabel":false},{"name":"Пшеничная мука","grams":9,"checkLabel":false},{"name":"Молоко 2%","grams":98,"checkLabel":false},{"name":"Полутвёрдый сыр (обычный)","grams":43,"checkLabel":false},{"name":"Тунец консервированный в воде","grams":27,"checkLabel":false},{"name":"Кукуруза","grams":55,"checkLabel":false},{"name":"Зелень","grams":5,"checkLabel":false}],"steps":["Разогрейте духовку до 180°C, или 160°C с конвекцией.","Отварите ригатони на 2 минуты меньше времени на упаковке.","В кастрюле растопите масло, вмешайте муку и готовьте 1 минуту; постепенно добавьте молоко и приготовьте густой белый соус.","Вмешайте большую часть сыра, затем пасту, тунца, кукурузу и петрушку.","Переложите в форму, посыпьте оставшимся сыром и запекайте 15–20 минут."],"adaptation":"Проверить перевод, хранение и КБЖУ."},{"id":"goodfood-family-meals-chicken-veg-casserole","kind":"existing","title":"Куриное рагу с овощами","slot":"dinner","time":75,"macros":{"kcal":364,"protein":37.5,"fat":11.8,"carbs":28.8},"image":"/recipe-images/goodfood-family-meals-chicken-veg-casserole.webp","sourceTitle":"Family meals: Chicken & veg casserole","sourceUrl":"https://www.bbcgoodfood.com/recipes/family-meals-chicken-veg-casserole","ingredients":[{"name":"Сливочное масло","grams":5,"checkLabel":false},{"name":"Репчатый лук","grams":37,"checkLabel":false},{"name":"Морковь","grams":80,"checkLabel":false},{"name":"Сельдерей","grams":27,"checkLabel":false},{"name":"Куриное бедро без кожи","grams":167,"checkLabel":false},{"name":"Чеснок","grams":3,"checkLabel":false},{"name":"Протёртые томаты","grams":133,"checkLabel":false},{"name":"Сухой бульон","grams":3,"checkLabel":false},{"name":"Сладкий перец","grams":50,"checkLabel":false}],"steps":["Растопите масло в тяжёлой кастрюле.","На слабом огне размягчите лук, морковь и сельдерей.","Добавьте куриные бёдра, чеснок, паприку, кумин и тимьян; помешивайте, пока поверхность курицы не побелеет.","Добавьте рубленые томаты, бульонный кубик, перец и воду так, чтобы она почти покрывала содержимое.","Доведите до слабого кипения и готовьте без крышки 50 минут.","Если используете нут, вмешайте его за 5 минут до конца. Подавайте с рисом."],"adaptation":"Проверить перевод, хранение и КБЖУ."},{"id":"goodfood-banana-overnight-oats","kind":"existing","title":"Ночная овсянка с бананом","slot":"breakfast","time":5,"macros":{"kcal":521.4,"protein":32.3,"fat":11.5,"carbs":77.1},"image":"/recipe-images/goodfood-banana-overnight-oats.webp","sourceTitle":"Banana overnight oats","sourceUrl":"https://www.bbcgoodfood.com/recipes/banana-overnight-oats","ingredients":[{"name":"Банан","grams":118,"checkLabel":false},{"name":"Овсяные хлопья","grams":50,"checkLabel":false},{"name":"Кленовый сироп","grams":10,"checkLabel":false},{"name":"Молоко 2%","grams":155,"checkLabel":false},{"name":"Миндаль","grams":7,"checkLabel":false},{"name":"Протеиновый порошок","grams":20,"checkLabel":false}],"steps":["Разомните один банан вилкой.","Смешайте его с овсянкой, корицей, кленовым сиропом, молоком и ореховой пастой в миске до однородности.","Накройте миску и оставьте в холодильнике на ночь.","Утром перемешайте, разделите на порции, добавьте ломтики оставшегося банана, миндаль, щепотку корицы и при желании йогурт."],"adaptation":"Добавлено 20 г протеина на порцию."},{"id":"goodfood-family-meals-easy-fish-cakes","kind":"existing","title":"Простые рыбные котлеты","slot":"dinner","time":45,"macros":{"kcal":385.2,"protein":28.7,"fat":13.3,"carbs":38.9},"image":"/recipe-images/goodfood-family-meals-easy-fish-cakes.webp","sourceTitle":"Family meals: Easy fish cakes","sourceUrl":"https://www.bbcgoodfood.com/recipes/family-meals-easy-fish-cakes","ingredients":[{"name":"Рыбная смесь","grams":100,"checkLabel":false},{"name":"Репчатый лук","grams":83,"checkLabel":false},{"name":"Молоко 2%","grams":26,"checkLabel":false},{"name":"Картофель","grams":113,"checkLabel":false},{"name":"Кукуруза","grams":19,"checkLabel":false},{"name":"Полутвёрдый сыр (обычный)","grams":8,"checkLabel":false},{"name":"Куриное яйцо","grams":13,"checkLabel":false},{"name":"Пшеничная мука","grams":8,"checkLabel":false},{"name":"Оливковое масло","grams":7,"checkLabel":false}],"steps":["Сварите картофель до едва заметной мягкости, хорошо слейте воду и верните в горячую кастрюлю на 1–2 минуты, чтобы выпарить влагу.","Разомните с небольшим количеством сливочного масла и остудите.","Положите рыбную смесь, зелёный лук и молоко в неглубокую посуду, накройте с отверстиями и готовьте в микроволновке 1½–2 минуты до едва готовой рыбы.","Либо осторожно припустите в кастрюле до непрозрачности.","Откиньте рыбу и лук через мелкое сито.","Аккуратно соедините рыбу с пюре, кукурузой, чеддером и перцем, стараясь не раскрошить крупные кусочки.","Сформуйте 6–8 котлет.","Обмакните каждую во взбитое яйцо, затем обваляйте в муке.","Если масса мягкая, охладите не менее 30 минут; на этом этапе котлеты можно заморозить по одной.","Разогрейте в большой сковороде щедрый слой оливкового масла.","Обжаривайте котлеты по 5–7 минут с каждой стороны до равномерной золотистой корочки и полного прогрева внутри."],"adaptation":"Проверить перевод, хранение и КБЖУ."},{"id":"new-home-buckwheat-legs","kind":"new","title":"Гречка с куриными ножками и йогуртовым соусом","slot":"dinner","time":80,"macros":{"kcal":542.2,"protein":49.4,"fat":13.9,"carbs":58},"image":"/recipe-images/new-home-buckwheat-legs.jpg","sourceTitle":"Гречка с куриными ножками в духовке","sourceUrl":"https://food.ru/recipes/115681-grechka-s-kurinymi-nozhkami-v-dukhovke-1645019420","ingredients":[{"name":"Куриное бедро без кожи","grams":180,"checkLabel":false},{"name":"Гречка сухая","grams":60,"checkLabel":false},{"name":"Морковь","grams":33,"checkLabel":false},{"name":"Репчатый лук","grams":30,"checkLabel":false},{"name":"Сладкий перец","grams":25,"checkLabel":false},{"name":"Кабачок","grams":42,"checkLabel":false},{"name":"Томат","grams":30,"checkLabel":false},{"name":"Оливковое масло","grams":3,"checkLabel":false},{"name":"Горчица","grams":4,"checkLabel":false},{"name":"Греческий йогурт 2%","grams":50,"checkLabel":false},{"name":"Чеснок","grams":3,"checkLabel":false}],"steps":["Смешайте ножки с горчицей, паприкой, половиной чеснока и солью.","Овощи слегка обжарьте, переложите в форму, добавьте промытую гречку и 720 мл кипятка.","Разложите ножки сверху и запекайте под фольгой 50–60 минут при 180°C, до 74°C в центре мяса.","Смешайте йогурт с оставшимся чесноком и разлейте соус по отдельным ёмкостям."],"adaptation":"Добавлен отдельный йогуртовый соус; мясная порция усилена."},{"id":"new-home-cutlets-mash","kind":"new","title":"Куриные котлеты с пюре и быстрым соусом","slot":"dinner","time":45,"macros":{"kcal":580.4,"protein":45.9,"fat":22.7,"carbs":49.1},"image":"/recipe-images/new-home-cutlets-mash.jpg","sourceTitle":"Котлеты с пюре и соусом","sourceUrl":"https://food.ru/recipes/250423-kotlety-s-piure-i-sousom","ingredients":[{"name":"Куриный фарш","grams":180,"checkLabel":false},{"name":"Панировочные сухари","grams":10,"checkLabel":false},{"name":"Куриное яйцо","grams":15,"checkLabel":false},{"name":"Репчатый лук","grams":25,"checkLabel":false},{"name":"Картофель","grams":200,"checkLabel":false},{"name":"Молоко 2%","grams":40,"checkLabel":false},{"name":"Сливочное масло","grams":5,"checkLabel":false},{"name":"Греческий йогурт 2%","grams":50,"checkLabel":false},{"name":"Горчица","grams":5,"checkLabel":false},{"name":"Соевый соус","grams":5,"checkLabel":false}],"steps":["Смешайте фарш, яйцо, сухари, мелко нарезанный лук и специи; сформуйте 8 котлет.","Обжарьте по 3–4 минуты с каждой стороны, затем доведите под крышкой до 74°C внутри.","Отварите картофель, разомните с молоком и маслом.","Смешайте йогурт, горчицу и соевый соус; упакуйт
